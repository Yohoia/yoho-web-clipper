name: Release Chrome extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package and upload
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tag
        uses: actions/checkout@v5

      - name: Validate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Package runtime files
        run: |
          set -euo pipefail
          STAGE="dist/shiye-chrome-extension"
          mkdir -p "$STAGE"
          cp -R manifest.json icons popup options src "$STAGE/"
          find dist -name .DS_Store -delete
          (
            cd dist
            zip -r ../shiye-chrome-extension.zip shiye-chrome-extension
          )
          shasum -a 256 shiye-chrome-extension.zip > shiye-chrome-extension.zip.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          ## 拾页 ${TAG}

          Chrome MV3 网页剪藏扩展，用于将网页保存到页息 PageHush 的 Markdown 草稿。

          ### 安装

          1. 下载 \`shiye-chrome-extension.zip\` 并解压。
          2. 打开 Chrome 的 \`chrome://extensions/\`，开启「开发者模式」。
          3. 点击「加载已解压的扩展程序」，选择解压后的 \`shiye-chrome-extension\` 目录。

          下载包只包含扩展运行所需文件；仓库源码、测试和验证材料不进入发行包。
          EOF
          gh release create "$TAG" \
            shiye-chrome-extension.zip \
            shiye-chrome-extension.zip.sha256 \
            --title "拾页 ${TAG}" \
            --notes-file release-notes.md
